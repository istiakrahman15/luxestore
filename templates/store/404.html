{% extends "base.html" %}
{% block title %}Page not found — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="error-page">
  <div class="container">
    <p class="error-code mb-2">404</p>
    <h1 class="h2 mb-3">This shelf is empty</h1>
    <p class="text-muted-custom mb-4 mx-auto" style="max-width:40ch;">
      The page you're looking for doesn't exist, or has been moved. Let's get you back to the catalog.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{% url 'store:home' %}" class="btn btn-luxe-gold">Back to home</a>
      <a href="{% url 'store:product_list' %}" class="btn btn-luxe-ghost">Browse products</a>
    </div>
  </div>
</section>
{% endblock %}
